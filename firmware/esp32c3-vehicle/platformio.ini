[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.2
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Os
    -D CORE_DEBUG_LEVEL=0
    -D LOG_LOCAL_LEVEL=0
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
